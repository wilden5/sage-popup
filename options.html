<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Oxford Popup — Settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #1f2328;
        max-width: 460px;
        margin: 24px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      label {
        font-weight: 600;
        display: block;
        margin-bottom: 4px;
      }
      .hint {
        font-size: 12px;
        color: #57606a;
        margin: 0 0 10px;
      }
      .hint a {
        color: #1a56a0;
      }
      #key {
        font: inherit;
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #d0d4d9;
        border-radius: 6px;
        margin-bottom: 10px;
      }
      #key:focus {
        outline: none;
        border-color: #1a56a0;
      }
      button {
        font: inherit;
        font-size: 13px;
        color: #1a56a0;
        background: #eef3f9;
        border: 1px solid #d7e3f2;
        border-radius: 6px;
        padding: 5px 14px;
        cursor: pointer;
        margin-right: 8px;
      }
      button:hover {
        background: #dcebf9;
      }
      #status {
        font-size: 12px;
        color: #57606a;
        margin-top: 12px;
        min-height: 18px;
      }
      #status.ok,
      #perm.ok {
        color: #1e7b34;
      }
      #status.err,
      #perm.err {
        color: #c72c1e;
      }
      #perm {
        font-size: 12px;
        margin: 6px 0 0;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <h1>Oxford Popup</h1>
    <label for="key">Mistral API key</label>
    <p class="hint">
      Needed only for AI explanations: selected phrases and words missing from
      Oxford. Get a free key at
      <a href="https://console.mistral.ai/api-keys" target="_blank" rel="noopener noreferrer">console.mistral.ai</a>.
      The key is stored only in this browser and sent only to api.mistral.com.
      Without a key the extension keeps working Oxford-only.
    </p>
    <input id="key" type="password" autocomplete="off" placeholder="paste your key here" />
    <button id="save">Save</button>
    <button id="test">Test key</button>
    <button id="grant">Grant access</button>
    <p id="perm"></p>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
