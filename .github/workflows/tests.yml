name: tests

# Free plan: private repos get 2000 Actions minutes/month, this job uses ~2.
on:
  push:
    # main = merged milestones (frozen at v1.3.0 during tracker work);
    # "tracker" = the umbrella feature branch for the tracker/collection/SRS
    # work; "tracker-t" = the active phase-T round branch. Every agent
    # round gets a full check automatically (Vibe reviews diffs,
    # Actions proves green).
    branches: [main, tracker, tracker-t]
  schedule:
    # Daily 06:30 UTC = 09:30 Minsk (UTC+3). GitHub may delay cron runs a bit
    # during busy periods — fine for a once-a-day health check.
    - cron: "30 6 * * *"
  # Manual trigger from the Actions tab ("Run workflow" button).
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm install, not npm ci: there is no package-lock.json by design
      # (agents are forbidden to run installs, so nobody generates one).
      - name: "npm install"
        run: npm install
      - name: "build"
        run: npm run build
      - name: "Unit tests — inflection, prompts, AI answer parsing"
        run: npm test
      - name: "Live checks — Oxford markup, provider endpoints"
        run: node scripts/live-check.js
      - name: "Upload build zip"
        uses: actions/upload-artifact@v5
        with:
          name: sage-popup
          path: dist/sage-popup.zip
