name: tests

# Free plan: private repos get 2000 Actions minutes/month, this job uses ~2.
on:
  push:
    # main = merged milestones; ts-migration = every agent round gets a
    # full check automatically (Vibe reviews diffs, Actions proves green).
    branches: [main, ts-migration]
  schedule:
    # Daily 06:30 UTC = 09:30 Minsk (UTC+3). GitHub may delay cron runs a bit
    # during busy periods — fine for a once-a-day health check.
    - cron: "30 6 * * *"
  # Manual trigger from the Actions tab ("Run workflow" button).
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm install, not npm ci: there is no package-lock.json (agents are
      # forbidden to run installs, so nobody generates it; revisit at M5).
      - name: "npm install"
        run: npm install
      - name: "build"
        run: npm run build
      - name: "Unit tests — inflection, prompts, AI answer parsing"
        run: |
          node test_inflect.js
          node test_ai_parse.js
      - name: "Live checks — Oxford markup, api.mistral.ai"
        run: node scripts/live-check.js
